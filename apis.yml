  - type: APIReference
    url: https://leadpages.com/developers/docs
  - type: Authentication
    url: authentication/leadpages-authentication.yml
  - type: Webhooks
    url: asyncapi/leadpages-webhooks.yml
- name: Leadpages MCP Server
  description: >-
    Hosted Model Context Protocol server exposing 47 tools across Pages, Sites, Assets, Blogs, Brand
    Kit and Utility categories, letting AI assistants build, publish, edit and manage landing pages,
    sites and blogs. Authenticates with OAuth 2.0 and PKCE — no API keys — and is included on every
    plan, including the free trial.
  humanURL: https://leadpages.com/developers/mcp
  baseURL: https://mcp.leadpages.com/mcp
  tags:
  - Agents
  - Landing Pages
  - Content Management
  properties:
  - type: MCPServer
    url: mcp/leadpages-mcp.yml
  - type: Documentation
    url: https://leadpages.com/developers/mcp
  - type: OAuthScopes
    url: scopes/leadpages-scopes.yml
- name: Leadpages A2A Agent
  description: >-
    Agent2Agent endpoint for a nine-agent marketing team — Otto, Piper, Cash, Iris, Ray, Milo, Penn,
    Vera and Cam — that watches campaigns, proposes optimizations and, with explicit approval,
    executes changes against live ad accounts. Five skills covering team chat, per-agent chat,
    proposal review, proposal approval and funnel overview, secured with OAuth 2.0.
  humanURL: https://leadpages.com/developers
  baseURL: https://leadpages.com/api/a2a
  tags:
  - Agents
  - Marketing
  properties:
  - type: AgentCard
    url: a2a/leadpages-a2a.yml

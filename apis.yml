aid: leadpages
name: Leadpages
description: >-
  Leadpages is an AI web platform with built-in conversion optimization, part of the Redbrick family
  of brands. It builds and hosts landing pages, multi-page sites and blogs that improve themselves
  through A/B testing, Smart Traffic variant routing, click and scroll heatmaps, dynamic text
  replacement and auto-personalization, with no traffic caps on any plan. For developers and agents it
  publishes a REST API covering pages, sites, assets, blogs, analytics, forms, custom domains and brand
  kits; a hosted Model Context Protocol server exposing 47 tools over OAuth 2.0 with PKCE; webhooks for
  page-publish, lead-capture and form-submission events; and an A2A agent card describing a nine-agent
  campaign team. Founded 2012 and rebuilt from scratch in 2026.

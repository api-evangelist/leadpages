apis:
- name: Leadpages REST API
  description: >-
    RESTful API covering the full Leadpages platform across eight documented endpoint categories —
    Pages, Sites, Assets, Blogs, Analytics, Forms, Domains and Brand Kits — with JSON responses and
    bearer-token authentication using lp_-prefixed API keys. Available on the Pro plan and above.
  humanURL: https://leadpages.com/developers/docs
  baseURL: https://api.leadpages.com
  tags:
  - Landing Pages
  - Content Management
  - Marketing
  properties:
